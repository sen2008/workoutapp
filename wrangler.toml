# Deploy config for the backlog-sync Worker.
#
# .github/workflows/deploy-worker.yml runs `npx wrangler deploy` from the
# repository root whenever this file or worker/backlog-sync.js changes on
# main. Everything below is safe to commit — an account id and a KV
# namespace id are identifiers, not credentials.
#
# SYNC_TOKEN is deliberately not declared here: wrangler.toml has no field
# for a literal secret value, and it was set once directly against the
# Cloudflare API instead. `wrangler deploy` does not touch or remove a
# secret binding that isn't declared in this file, so it survives every
# future deploy without ever needing to appear here.

name = "backlog-sync"
main = "worker/backlog-sync.js"
compatibility_date = "2026-08-19"
account_id = "bc9c5db7e67d6ddb2f4eaad146b20961"

# Only this origin may call the Worker from a browser. Scheme and host only —
# no path, no trailing slash. Matches docs/CNAME (see build_site.mjs) — change
# both together if the site ever moves domains.
[vars]
ORIGIN = "https://workout.lucaswalker.net"

# The log lives here. `id` is the KV namespace's ID from
# Storage & Databases -> KV.
[[kv_namespaces]]
binding = "BACKLOG"
id = "695870adc9514984b3d195956b89ef89"
