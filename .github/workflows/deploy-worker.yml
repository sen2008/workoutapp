name: Deploy Worker

# Redeploys worker/backlog-sync.js to Cloudflare whenever it, or wrangler.toml,
# changes on main. The KV binding, account id and ORIGIN var all come from
# wrangler.toml, which is safe to commit — none of them are secrets.
#
# SYNC_TOKEN is not declared anywhere in this repo. It was set once directly
# against the Cloudflare API, and `wrangler deploy` does not touch or remove a
# secret that isn't declared in wrangler.toml — so it survives every deploy
# this workflow makes without ever passing through this file or this repo.
#
# Needs a CLOUDFLARE_API_TOKEN repository secret, scoped to Workers Scripts
# and Workers KV Storage — nothing wider. Settings -> Secrets and variables ->
# Actions -> New repository secret.

on:
  push:
    branches: [main]
    paths:
      - 'worker/backlog-sync.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse to deploy without the token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
